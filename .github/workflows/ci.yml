name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-dejavu-core poppler-utils imagemagick unzip

      - name: Install Source Sans 3 (Adobe release, OFL)
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sSL -o /tmp/ss.zip https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          unzip -q -o /tmp/ss.zip -d /tmp/ss
          find /tmp/ss -name '*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Link @preview to the checkout
        run: |
          ./scripts/dev_link @preview
          typst fonts | grep -i "source sans" || (echo "Source Sans not visible to typst" && exit 1)

      # Ubuntu's `just` is too old for the Justfile's [group] attributes: run the
      # same commands as `just compile-all` directly.
      - name: Compile the starters (student + solutions)
        run: |
          ./scripts/show-pkg-mode
          mkdir -p examples
          typst compile template/exam.typ examples/exam.pdf
          typst compile --input solutions=true template/exam.typ examples/exam-sol.pdf
          typst compile template/series.typ examples/series.pdf
          typst compile --input solutions=true template/series.typ examples/series-sol.pdf

      - name: Smoke tests (typst init + page counts)
        run: ./scripts/test-exam.sh

      - name: Bundle check
        run: ./scripts/check-pack

      - name: Compare with the LaTeX references
        run: |
          DPI=80 ./tools/compare-exam.sh template/exam.typ tests/reference/exam-sample.pdf tests/reference/exam-sample-sol.pdf out/exam
          DPI=80 ./tools/compare-exam.sh template/series.typ tests/reference/serie-sample.pdf tests/reference/serie-sample-sol.pdf out/series

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdfs-and-comparisons
          path: |
            examples/*.pdf
            out/**/compare-*.png
          retention-days: 14
